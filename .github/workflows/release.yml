name: Release dagnam-record to PyPI

on:
  push:
    tags:
      - "v*"

# Guard against double-tag races (e.g. delete + re-push of the same tag, or two
# tags arriving simultaneously). cancel-in-progress=false because once a build
# starts uploading to PyPI we must let it finish: PyPI rejects re-uploads of
# the same version, so cancellation would just produce a half-released state.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

# Nothing is inherited: every job below states what it needs.
permissions: {}

jobs:
  # There is no platform job: dagnam-record depends on nothing, so no platform contract can be
  # ahead of or behind it. What is checked first is the release itself: the tag, `__version__`
  # and the changelog name one version. The package has no static version (hatchling reads
  # `__version__`), so the tag is compared with that.
  check:
    name: Tag, version and changelog agree
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # Full history, so the ancestry check below can answer. Credentials are not persisted:
      # no later step pushes, and the fetch below reads a PUBLIC repository, which GitHub serves
      # anonymously.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # A release is a tag on `main` (or on a `release/X.Y` backport branch, see RELEASE.md).
      # This stops an ACCIDENTAL tag on an unmerged branch; it does not stop a malicious one,
      # because the check is part of the tagged commit's own workflow file. That is what the
      # tag ruleset and the `pypi` environment's required reviewer are for (RELEASE.md).
      - name: Assert the tagged commit is on main or a release branch
        run: |
          git fetch --no-tags origin \
            '+refs/heads/main:refs/remotes/origin/main' \
            '+refs/heads/release/*:refs/remotes/origin/release/*'
          # HEAD is the tagged commit (GITHUB_SHA, peeled if the tag is annotated).
          for ref in $(git for-each-ref --format='%(refname)' refs/remotes/origin/main 'refs/remotes/origin/release/'); do
            git merge-base --is-ancestor HEAD "$ref" && exit 0
          done
          echo "::error::$(git rev-parse HEAD) (tag $GITHUB_REF_NAME) is not an ancestor of origin/main or origin/release/*; release only commits that are on main or a release branch"
          exit 1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The release's own changelog: nothing left under [Unreleased], the newest dated
      # heading is the version being tagged, and the tag is v<that version>.
      - name: Check the tag and changelog are ready for this release
        run: python scripts/check_changelog.py --tag "$GITHUB_REF_NAME" --tag-prefix v

  # The tagged commit passes the whole of CI (lint, types, the suite at its 100% coverage floor,
  # and the matrix of Python 3.9 to 3.13 against the lowest and highest openai and anthropic it
  # supports). A tag is what publishes and PyPI takes no version back, so nothing is built until
  # CI has passed on exactly this commit.
  ci:
    name: CI on the tagged commit
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read

  build:
    name: Build wheel and sdist
    needs: [check, ci]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job resolves fresh, unpinned tools (hatchling, twine, readme-renderer and their
    # dependencies), so it cannot mint an OIDC token: the attestation is its own job below.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          # This job's output is published: no restorable cache as an input.
          enable-cache: false
      - name: Build
        run: uv build
      - name: Check distribution metadata
        run: |
          uv run --no-project --with twine twine check dist/*
          uv run --no-project --with "readme-renderer[md]" python -m readme_renderer README.md > /dev/null
      # The oldest Python the package supports, with nothing but the built file installed.
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Install each built file into a clean environment and run it
        run: |
          version="${GITHUB_REF_NAME#v}"
          for built in dist/*.whl dist/*.tar.gz; do
            echo "== $built"
            python -m venv "$RUNNER_TEMP/smoke"
            "$RUNNER_TEMP/smoke/bin/pip" install "$built"
            "$RUNNER_TEMP/smoke/bin/python" scripts/smoke_record.py "$version"
            rm -rf "$RUNNER_TEMP/smoke"
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/

  # Attests exactly the files `build` made and smoke-tested, in a job that runs nothing but the
  # two pinned actions below, so no build tool can reach its OIDC token.
  attest:
    name: Attest build provenance
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - name: Generate build provenance attestation
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*"

  publish-testpypi:
    name: Publish to TestPyPI
    needs: [build, attest]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: testpypi
      url: https://test.pypi.org/p/dagnam-record
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          repository-url: https://test.pypi.org/legacy/

  smoke-testpypi:
    name: Install from TestPyPI and run it
    needs: publish-testpypi
    runs-on: ubuntu-latest
    # The install step alone waits up to 15 minutes for TestPyPI's index.
    timeout-minutes: 25
    # Installs from TestPyPI alone and runs what it installed; it reads this repository for the
    # smoke script only.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.9"
      - name: Install from TestPyPI
        run: |
          # TestPyPI's simple index lagged its own upload by more than 2.5 minutes
          # on 2026-09-07 (the environment wait timer used to hide that); wait up
          # to 15 minutes, and FAIL here rather than let the smoke test import an
          # absent package -- a loop that falls through exits 0.
          installed=0
          for i in $(seq 1 15); do
            # No dependencies, so nothing is taken from the real index: a squatted higher
            # version of the name there could otherwise win a tie against this one.
            if pip install --no-deps \
              --index-url https://test.pypi.org/simple/ \
              "dagnam-record==${GITHUB_REF_NAME#v}"; then installed=1; break; fi
            echo "Waiting for TestPyPI indexing ($i/15)..."
            sleep 60
          done
          test "$installed" = 1 || { echo "::error::dagnam-record ${GITHUB_REF_NAME#v} never appeared on TestPyPI"; exit 1; }
      - name: Run what was installed
        run: python scripts/smoke_record.py "${GITHUB_REF_NAME#v}"

  publish-pypi:
    name: Publish to PyPI
    needs: smoke-testpypi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: pypi
      url: https://pypi.org/p/dagnam-record
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
